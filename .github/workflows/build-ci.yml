# Based heavily on the docker build action from immich (https://github.com/immich-app/immich/)

name: Build CI and Release

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Local regression tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.18.0", "24.19.0"]
    services:
      mysql:
        image: mariadb:11.8.6
        env:
          MARIADB_ROOT_PASSWORD: isolated-root-password
          MARIADB_DATABASE: otf_test
          MARIADB_USER: otf_test
          MARIADB_PASSWORD: isolated-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      OTF_TEST_MYSQL_ISOLATED: "1"
      OTF_TEST_MYSQL_URL: mysql://otf_test:isolated-test-password@127.0.0.1:3306/otf_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build-docker:
    name: Build Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - id: lower-repo
        name: Repository to lowercase
        run: |
          REPO=${{ github.event.repository.name }}
          echo "repository=${REPO@L}" >> $GITHUB_OUTPUT

      - id: lower-owner
        name: Owner to lowercase
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER@L}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ env.ACT && github.actor || steps.lower-owner.outputs.owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate docker image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          flavor: |
            latest=auto
          images: |
            name=ghcr.io/${{ steps.lower-owner.outputs.owner }}/${{ steps.lower-repo.outputs.repository }}
          tags: |
            # Tag with branch name
            type=ref,event=branch
            # Tag with pr-number
            type=ref,event=pr
            # Tag with git tag on release
            type=ref,event=tag
            type=raw,value=release,enable=${{ github.event_name == 'release' }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}/openthings-build-cache:proxy', steps.lower-owner.outputs.owner) || '' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
